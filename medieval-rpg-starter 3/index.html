<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medieval Open-World RPG — Prototype</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0e1013; font-family: system-ui, -apple-system, sans-serif; color: #f4f5f7; }
    #hud {
      position: fixed; inset: 0; pointer-events: none; padding: 20px 24px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .panel {
      background: rgba(14, 16, 19, 0.72); border: 1px solid rgba(226, 164, 79, 0.35);
      backdrop-filter: blur(8px); padding: 12px 16px; border-radius: 8px;
      pointer-events: auto;
    }
    .panel h1 { font-size: 16px; font-weight: 700; color: #f2c178; margin-bottom: 4px; }
    .panel p { font-size: 13px; color: #d4dae3; line-height: 1.4; }
    .bars { display: flex; flex-direction: column; gap: 8px; min-width: 220px; }
    .bar-row { display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
    .bar-track { width: 100%; height: 8px; background: rgba(255,255,255,0.12); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; transition: width 0.15s ease; }
    .hp { background: #d94e4e; width: 100%; }
    .stamina { background: #4caf82; width: 100%; }
    .bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
    .controls { font-size: 12px; color: #a8b1be; }
    .controls span { color: #f2c178; font-weight: 600; }
    .weather-pill { font-size: 12px; color: #7ce0b0; font-weight: 600; }
    #crosshair {
      position: fixed; top: 50%; left: 50%; width: 8px; height: 8px;
      margin: -4px 0 0 -4px; border: 1.5px solid rgba(242, 193, 120, 0.85);
      border-radius: 50%; pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="crosshair"></div>
  <div id="hud">
    <div class="top-bar">
      <div class="panel">
        <h1>Medieval Open-World RPG</h1>
        <p id="status">Кликни по экрану для захвата мыши · Загрузка GLB поддерживается</p>
        <p class="weather-pill" id="weatherLabel">Погода: Ясно · День</p>
      </div>
      <div class="panel bars">
        <div class="bar-row">
          <span>Здоровье</span>
          <div class="bar-track"><div class="bar-fill hp" id="hpBar"></div></div>
        </div>
        <div class="bar-row">
          <span>Выносливость</span>
          <div class="bar-track"><div class="bar-fill stamina" id="staminaBar"></div></div>
        </div>
      </div>
    </div>
    <div class="bottom-bar">
      <div class="panel controls">
        <span>WASD</span> Движение · <span>Shift</span> Спринт · <span>Space</span> Прыжок ·
        <span>ЛКМ</span> Удар мечом · <span>ПКМ</span> Блок щитом · <span>T</span> Смена погоды
      </div>
      <div class="panel controls">
        Положи <span>.glb</span> модели в <span>assets/models/</span>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
